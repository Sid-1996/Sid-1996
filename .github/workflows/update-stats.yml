name: Update GitHub Stats Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/update-stats.yml', 'README.md' ]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Clone github-readme-stats source
        run: |
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs

      - name: Install dependencies
        run: cd /tmp/grs && npm install

      - name: Fetch SVGs
        run: |
          cd /tmp/grs
          nohup node express.js > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf "http://localhost:9000/api?username=Sid-1996" -o /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          mkdir -p "$GITHUB_WORKSPACE/stats"
          curl -s "http://localhost:9000/api?username=Sid-1996&show_icons=true&theme=dark&bg_color=0d1117&border_color=30363d" \
            -o "$GITHUB_WORKSPACE/stats/stats.svg"
          curl -s "http://localhost:9000/api/top-langs/?username=Sid-1996&layout=compact&theme=dark&bg_color=0d1117&border_color=30363d" \
            -o "$GITHUB_WORKSPACE/stats/top-langs.svg"
          kill $SERVER_PID 2>/dev/null || true

      - name: Commit and push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update github stats cards"
            git push
          fi
